[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridscale"
version = "1.0.0"
description = "Zero-code-change, carbon- and cost-aware compute scheduler"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["carbon-aware", "green-computing", "esg", "scheduler", "cloud-optimization", "spot-instances"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "requests>=2.25.0",
    "rich>=10.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
gridscale = "gridscale:main"

[tool.pytest.ini_options]
testpaths = ["test_gridscale.py"]
